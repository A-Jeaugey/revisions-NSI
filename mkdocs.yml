site_name: NSI Terminale
site_description: Pack complet de fiches de révision pour le bac NSI Terminale
site_author: Révisions NSI
site_url: https://a-jeaugey.github.io/revisions-NSI/

repo_name: A-Jeaugey/revisions-NSI
repo_url: https://github.com/A-Jeaugey/revisions-NSI
edit_uri: edit/main/docs/

copyright: <span class="footer-mark">— Pack de révision NSI Terminale, programme officiel BO 2020.</span>

theme:
  name: material
  language: fr
  custom_dir: overrides
  font: false   # désactive le chargement Material des fontes ; on charge nous-mêmes
  icon:
    logo: material/triangle-outline
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mode sombre
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/A-Jeaugey/revisions-NSI
      name: Dépôt GitHub
  generator: false

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap
  - stylesheets/extra.css
  - stylesheets/components.css

extra_javascript:
  - javascripts/app.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: §
      title: Sur cette page
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang:
        - fr
        - en
  - glightbox

nav:
  - Accueil: index.md
  - Plan: plan-de-revision.md
  - Réviser:
      - Flashcards: flashcards.md
      - Quiz QCM: quiz.md
  - Fiches:
      - Vue d'ensemble: fiches/index.md
      - "01 — Python : remise en route": fiches/01_python_remise_en_route.md
      - "02 — Récursivité": fiches/02_recursivite.md
      - "03 — Types abstraits de données": fiches/03_types_abstraits_donnees.md
      - "04 — Programmation orientée objet": fiches/04_programmation_orientee_objet.md
      - "05 — Graphes": fiches/05_graphes.md
      - "06 — Arbres": fiches/06_arbres.md
      - "07 — Bases de données (SQL)": fiches/07_bases_de_donnees.md
      - "08 — Diviser pour régner": fiches/08_diviser_pour_regner.md
      - "09 — Processus": fiches/09_processus.md
      - "10 — Linux": fiches/10_linux.md
      - "11 — Réseaux": fiches/11_reseaux.md
      - "12 — Glouton & KNN": fiches/12_glouton_knn.md
      - "13 — Programmation dynamique": fiches/13_programmation_dynamique.md
      - "14 — Cryptographie": fiches/14_cryptographie.md
      - "15 — System on Chip (SoC)": fiches/15_soc.md
      - "16 — Recherche textuelle": fiches/16_recherche_textuelle.md
      - "17 — Paradigmes de programmation": fiches/17_paradigmes_programmation.md
      - "18 — Approfondissement & synthèse": fiches/18_approfondissement.md
      - "19 — Décidabilité & calculabilité": fiches/19_decidabilite_calculabilite.md
  - Mémos:
      - Vue d'ensemble: memos/index.md
      - Complexités: memos/memo_complexites.md
      - Python (pièges bac): memos/memo_python_bac.md
      - SQL (cheat-sheet): memos/memo_sql_bac.md
      - Glossaire alphabétique: memos/memo_vocabulaire.md
  - Diagrammes:
      - Vue d'ensemble: diagrammes/index.md
      - Quel algo choisir ?: diagrammes/arbre_decision_algos.md
      - Parcours de graphes: diagrammes/parcours_graphes.md
      - Terminologie des arbres: diagrammes/arbres_terminologie.md
      - Modèle TCP/IP: diagrammes/modele_osi_tcpip.md
      - États d'un processus: diagrammes/etats_processus.md
